name: Release APK

# Auslöser:
#  - Tag-Push nach dem Muster "v*" (z.B. v0.4.0-beta1) -- der normale Weg,
#    einen Release anzustoßen: `git tag v0.4.0-beta1 && git push origin v0.4.0-beta1`.
#  - Manuell über "Run workflow" im Actions-Tab (Eingabe: Versions-Tag) --
#    praktisch für einen ersten Testlauf, ohne vorher einen echten Tag setzen
#    zu müssen.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Versions-Tag für den Release (z.B. v0.4.0-beta1)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      # "secrets" darf nicht direkt in einer if:-Bedingung stehen (GitHub-
      # Schema-Beschränkung) -- deshalb der Umweg über eine env-Variable.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # F-Droid baut aus demselben Tag und prüft versionName aus
      # app/build.gradle -- passt der nicht zum Tag, erkennt F-Droid das
      # Update nicht. Deshalb hier früh abbrechen statt still zu veröffentlichen.
      - name: Check versionName matches tag
        if: ${{ github.event_name == 'push' }}
        run: |
          tag="${{ steps.tag.outputs.name }}"
          version=$(sed -n 's/^ *versionName "\(.*\)"/\1/p' app/build.gradle)
          if [ "v$version" != "$tag" ]; then
            echo "::error::Tag $tag passt nicht zu versionName \"$version\" in app/build.gradle"
            exit 1
          fi

      # Gleiche Java-Hauptversion wie F-Droids Buildserver (Debian trixie,
      # default-jdk = OpenJDK 21) -- F-Droid baut die APK nach und
      # veröffentlicht sie nur, wenn sie bis auf die Signatur bytegleich mit
      # unserer ist (Reproducible Build, siehe FDROID.md).
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Kein eigener Android-SDK-Setup-Schritt: die ubuntu-latest-Runner
      # bringen bereits ein vorinstalliertes, lizenz-akzeptiertes Android SDK
      # mit (ANDROID_HOME schon gesetzt) -- AGP lädt bei Bedarf fehlende
      # Platform-/Build-Tools-Versionen während des Gradle-Builds selbst
      # nach. android-actions/setup-android@v3 versucht dagegen das längst
      # aus dem SDK-Repository entfernte Legacy-Paket "tools" zu
      # installieren und schlägt deshalb zuverlässig fehl.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.2

      # F-Droid übernimmt unsere Signatur -- ein unsignierter Tag-Release wäre
      # dort unbrauchbar, deshalb bei Tag-Pushes ohne Keystore hart abbrechen.
      - name: Require signing key for tag releases
        if: ${{ github.event_name == 'push' && env.HAS_KEYSTORE != 'true' }}
        run: |
          echo "::error::Secret ANDROID_KEYSTORE_BASE64 fehlt -- Tag-Releases müssen signiert sein (F-Droid Reproducible Build)"
          exit 1

      # Nur ausgeführt, wenn das Secret gesetzt ist -- ohne Keystore baut
      # assembleRelease trotzdem, nur eben unsigniert (siehe app/build.gradle).
      - name: Decode signing keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Collect APK
        run: |
          mkdir -p out
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          cp "$apk" "out/TrailBridge-${{ steps.tag.outputs.name }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: TrailBridge ${{ steps.tag.outputs.name }}
          files: out/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(steps.tag.outputs.name, '-beta') || contains(steps.tag.outputs.name, '-rc') }}
