plugins {
    id 'com.android.application'
}

android {
    namespace 'com.euphi.trailbridge'
    compileSdk 35

    defaultConfig {
        applicationId "com.euphi.trailbridge"
        minSdk 26
        targetSdk 35
        // Schema: versionCode = MAJOR*10000 + MINOR*100 + PATCH, versionName
        // = Git-Tag ohne "v" (Tag v0.4.2 -> "0.4.2" / 402). F-Droid erkennt
        // neue Versionen über die Tags und prüft genau diese beiden Werte --
        // vor jedem Release-Tag hier hochzählen, siehe FDROID.md.
        versionCode 402
        versionName "0.4.2"
    }

    // Kein von Google verschlüsselter Abhängigkeits-Blob in der APK -- F-Droid
    // lehnt den ab (nicht prüfbar), und er macht den Build unreproduzierbar.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    buildFeatures {
        aidl true
    }

    // Release-Signing kommt aus Umgebungsvariablen statt aus eingecheckten
    // Dateien -- lokal einfach ungesetzt lassen (assembleRelease baut dann
    // eine unsignierte APK), in CI setzt der Release-Workflow sie aus
    // GitHub-Secrets. Siehe BUILD.md, Abschnitt "Release".
    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // nothing special yet
        }
        release {
            minifyEnabled false
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

// Baseline-Profile (assets/dexopt/baseline.prof) nicht erzeugen: die Datei
// ist zwischen Builds nicht immer bytegleich und würde F-Droids
// Reproducible-Build-Vergleich scheitern lassen (siehe FDROID.md). Für eine
// App dieser Größe ist der Startzeit-Gewinn vernachlässigbar.
tasks.configureEach { task ->
    if (task.name.contains("ArtProfile")) {
        task.enabled = false
    }
}
