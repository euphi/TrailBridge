plugins {
    id 'com.android.application'
}

android {
    namespace 'com.euphi.trailbridge'
    compileSdk 35

    defaultConfig {
        applicationId "com.euphi.trailbridge"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.3-trailbridge"
    }

    buildFeatures {
        aidl true
    }

    // Release-Signing kommt aus Umgebungsvariablen statt aus eingecheckten
    // Dateien -- lokal einfach ungesetzt lassen (assembleRelease baut dann
    // eine unsignierte APK), in CI setzt der Release-Workflow sie aus
    // GitHub-Secrets. Siehe BUILD.md, Abschnitt "Release".
    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // nothing special yet
        }
        release {
            minifyEnabled false
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
